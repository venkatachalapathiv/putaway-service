
spring.application.name=putaway-service

server.port=8084

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/putaway-service
spring.datasource.username=postgres
spring.datasource.password=venkat
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway Database Migration
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=putaway-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

spring.kafka.listener.ack-mode=record

# ===============================
# Outbox Publisher
# ===============================
app.outbox.poll-delay-ms=5000
app.outbox.batch-size=100
app.outbox.max-attempts=5
app.outbox.send-timeout-seconds=10

# Automatic retry backoff
app.outbox.retry.initial-delay-ms=5000
app.outbox.retry.max-delay-ms=60000

# ===============================
# JWT Security
# ===============================
security.jwt.secret=${JWT_SECRET:my-super-secret-key-for-wms-jwt-256-bit}
security.jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Logging
# ===============================
logging.level.root=INFO

# Application logs
logging.level.com.company.wms=DEBUG
logging.level.com.company.wms.putaway=DEBUG

# Reduce framework log noise
logging.level.org.springframework.web=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO

# Reduce Hibernate SQL and parameter-binding noise
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Correlation ID in console logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-NO-CORRELATION-ID}] %logger{36} - %msg%n
